global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: node-exporter
    static_configs: [{ targets: ["node-exporter:9100"] }]

  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]

  - job_name: nvidia-gpu
    static_configs: [{ targets: ["nvidia-gpu-exporter:9835"] }]

  - job_name: litellm
    static_configs: [{ targets: ["litellm:4001"] }]
    metrics_path: "/metrics/"

  - job_name: agent-observer
    static_configs: [{ targets: ["agent-observer:9101"] }]
